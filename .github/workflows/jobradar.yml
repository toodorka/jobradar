name: JobRadar - automatska pretraga poslova

on:
  workflow_dispatch:
  schedule:
    - cron: "17 1,7,13,19 * * *"
  push:
    branches: [main]
    paths:
      - "collector.py"
      - ".github/workflows/jobradar.yml"

permissions:
  contents: write

concurrency:
  group: jobradar-scan
  cancel-in-progress: false

jobs:
  refresh-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pretrazi oglase i rangiraj
        env:
          JOOBLE_RS_KEY: ${{ secrets.JOOBLE_RS_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python collector.py
      - name: Sacuvaj podatke za automatsko objavljivanje
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh JobRadar listings"
            git push
          fi
